stages:
  - build
  - test

variables:
  BUILD_DIR: "build"

build:
  stage: build
  image: gcc:latest
  before_script:
    - apt-get update && apt-get install -y cmake libpng-dev zlib1g-dev
  script:
    - mkdir -p ${BUILD_DIR}
    - cd ${BUILD_DIR}
    - cmake .. -DBUILD_EXAMPLES=OFF
    - cmake --build .
  artifacts:
    paths:
      - ${BUILD_DIR}/
    expire_in: 1 hour

test:
  stage: test
  image: gcc:latest
  dependencies:
    - build
  before_script:
    - apt-get update && apt-get install -y cmake libpng-dev zlib1g-dev
  script:
    - cd ${BUILD_DIR}
    - ctest --output-on-failure
